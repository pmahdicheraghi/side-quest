name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: |
          npm run format:check
          npm run lint

      - name: Build once for all environments
        run: npm run build

      - name: Verify release metadata
        shell: bash
        run: |
          node -e "const v=require('./dist/version.json'); if(v.release !== process.env.GITHUB_REF_NAME.slice(1) || v.commit !== process.env.GITHUB_SHA.slice(0, 7)) process.exit(1)"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: side-quest-${{ github.ref_name }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: side-quest-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: side-quest-${{ github.ref_name }}
          path: dist

      - name: Deploy to production
        env:
          APP_URL: ${{ vars.APP_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORAGE_ACCESS_TOKEN }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_TOKEN }}
          OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
          OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
          OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION }}
        run: bash scripts/deploy-static-site.sh
